name: Publish Frontend Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_SUFFIX: bma-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set immutable image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_SUFFIX}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release and Git SHA tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=long

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable digest
        run: |
          echo "Published image digest: ${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this exact reference in staging: ${IMAGE_NAME}@${{ steps.publish.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
